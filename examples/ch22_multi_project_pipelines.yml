# Optional extension to a configured, authorized downstream project.
deploy_to_platform:
  stage: deploy
  trigger:
    project: supplier-quality/sqm-platform
    branch: main
    strategy: mirror
  variables:
    UPSTREAM_MODEL_SHA: $CI_COMMIT_SHA
    UPSTREAM_RUN_ID: $CI_PIPELINE_ID
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      when: manual
      allow_failure: false
