# Optional production-storage extension: choose one destination.
# The runner must have the needed CLI, least-privilege credentials,
# and verified model artifacts from train_model and evaluate.
register_s3:
  stage: register
  needs: [train_model, evaluate]
  script:
    - test -n "$MODEL_BUCKET" && test -n "$MODEL_KMS_KEY_ID"
    - DEST="s3://${MODEL_BUCKET}/supplier-risk/${CI_COMMIT_SHA}/${CI_PIPELINE_ID}"
    - aws s3 cp artifacts/model/ "$DEST/" --recursive --sse aws:kms --sse-kms-key-id "$MODEL_KMS_KEY_ID"

# Alternative to register_s3; do not run both accidentally.
register_package:
  stage: register
  needs: [train_model, evaluate]
  script:
    - tar -czf artifacts/model.tar.gz -C artifacts/model .
    - PROJ="${CI_API_V4_URL}/projects/${CI_PROJECT_ID}"
    - PKG="${PROJ}/packages/generic/supplier-risk"
    - VERSION="${CI_COMMIT_SHA}-${CI_PIPELINE_ID}"
    - >-
      curl --fail-with-body --header "JOB-TOKEN: $CI_JOB_TOKEN"
      --upload-file artifacts/model.tar.gz "${PKG}/${VERSION}/model.tar.gz"
