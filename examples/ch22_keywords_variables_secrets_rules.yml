# Chapter 22 — 22.2 Keywords, Variables, Secrets, Rules
# The built-in variables you will actually use
# $CI_COMMIT_SHA      the full commit hash
# $CI_COMMIT_BRANCH   branch name, empty on tags
# $CI_COMMIT_TAG      tag name, empty otherwise
# $CI_DEFAULT_BRANCH  usually "main"
# $CI_PIPELINE_SOURCE push, merge_request_event,
#                     schedule, trigger, api, web
# $CI_REGISTRY_IMAGE  this project's image namespace
# $CI_PROJECT_DIR     repo root inside the runner
# $CI_JOB_TOKEN       short-lived token for GitLab APIs
