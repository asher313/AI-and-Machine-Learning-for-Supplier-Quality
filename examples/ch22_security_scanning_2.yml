# Chapter 22 — 22.6 Security Scanning
# Chapter 21.2's rule, enforced: only the gateway may
# import the raw model client.
gateway_only:
  stage: test
  before_script: []
  script:
    - >-
      ! grep -rn --include=*.py --exclude-dir=gateway
      -E "from sqm_ai\.llm import .*\bclient\b" src/sqm_ai
