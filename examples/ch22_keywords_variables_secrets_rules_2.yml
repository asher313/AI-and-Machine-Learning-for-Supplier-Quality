# Chapter 22 — 22.2 Keywords, Variables, Secrets, Rules
deploy_production:
  stage: deploy
  script: ./scripts/deploy.sh production
  rules:
    # a push to main gives a button, not a deployment
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH &&
          $CI_PIPELINE_SOURCE == "push"
      when: manual
    # a version tag deploys on its own
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
      when: on_success
    - when: never

# Run only on merge requests
mr_only:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

# Same job, different target per branch
build:
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      variables:
        ENV: production
    - if: $CI_COMMIT_BRANCH =~ /^release\//
      variables:
        ENV: staging
    - when: never
