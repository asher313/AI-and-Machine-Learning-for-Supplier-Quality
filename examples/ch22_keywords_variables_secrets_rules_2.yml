# A rules fragment for the full release job in Section 22.3.
# Protect release tags and environments in project settings.
.release_rules:
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE == "push"'
      when: manual
      allow_failure: false
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/'
      when: manual
      allow_failure: false
    - when: never

mr_only:
  stage: test
  script: [uv run --no-sync pytest tests/test_ncr.py]
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'

select_target:
  stage: test
  script: [echo "$TARGET_ENV"]
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      variables: {TARGET_ENV: production}
    - if: '$CI_COMMIT_BRANCH =~ /^release\//'
      variables: {TARGET_ENV: staging}
    - when: never
