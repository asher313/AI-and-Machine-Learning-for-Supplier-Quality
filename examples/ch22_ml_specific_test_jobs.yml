# Chapter 22 — 22.8 ML-Specific Test Jobs
# 1 — unit: pure functions, no data, no network
test_units:
  stage: test
  script:
    - uv run pytest tests/unit -q

# 2 — integration: a real database, started as a service
test_integration:
  stage: test
  services:
    - name: postgres:16
      alias: postgres
  variables:
    POSTGRES_DB: sqm_test
    POSTGRES_USER: sqm
    POSTGRES_PASSWORD: test
    DATABASE_URL: >-
      postgresql+psycopg://sqm:test@postgres:5432/sqm_test
  script:
    - uv run python scripts/setup_test_db.py
    - uv run pytest tests/integration -q -m integration

# 3 — contract: does the trained model still behave?
test_model_contract:
  stage: evaluate
  needs: [train_model]
  script:
    - uv run pytest tests/model -q
        --model artifacts/${MODEL_NAME}-${CI_COMMIT_SHA}
        --golden-set data/golden_set.jsonl
        --min-accuracy 0.85

# 4 — language model: recorded responses, never live calls
test_llm_playback:
  stage: test
  variables:
    SQM_LLM_MODE: playback
    ANTHROPIC_API_KEY: "not-used-in-playback"
  script:
    - uv run pytest tests/llm -q -m llm
