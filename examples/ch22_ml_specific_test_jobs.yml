# Supplementary jobs for the main pipeline's environment.
test_units:
  stage: test
  script: [uv run --no-sync pytest tests/test_ncr.py tests/test_ci.py]

test_integration:
  stage: test
  services:
    - name: postgres:16
      alias: postgres
  variables:
    POSTGRES_DB: postgres
    POSTGRES_USER: sqm
    POSTGRES_PASSWORD: test-only
    SQM_TEST_DATABASE_URL: postgresql+psycopg://sqm:test-only@postgres:5432/postgres
  script:
    - uv run --no-sync pytest tests/test_supplier_month.py tests/gateway

test_model_contract:
  stage: evaluate
  needs: [train_model]
  script:
    - uv run --no-sync pytest tests/build1/test_training_partitions.py tests/build1/test_score_contract.py

# These tests explicitly inject scripted SDK responses, not an environment mode.
test_llm_playback:
  stage: test
  script:
    - uv run --no-sync pytest tests/test_llm_boundary.py tests/test_structured_boundary.py tests/triage/test_pipeline.py
