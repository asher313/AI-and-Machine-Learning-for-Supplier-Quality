# Chapter 22 — 22.1 The Mental Model
# .gitlab-ci.yml  (minimal, but real)
stages:
  - lint
  - test
  - deploy

lint:
  stage: lint
  image: python:3.12-slim
  script:
    - pip install --quiet ruff
    - ruff check .
    - ruff format --check .

unit_tests:
  stage: test
  image: python:3.12-slim
  script:
    - pip install --quiet uv
    - uv sync --locked
    - uv run pytest tests/ -v

deploy_prod:
  stage: deploy
  image: alpine:3.20
  script:
    - apk add --no-cache curl
    - curl -fsS -X POST "$DEPLOY_WEBHOOK"
        -d "image=$CI_REGISTRY_IMAGE:$CI_COMMIT_SHA"
  environment:
    name: production
    url: https://sqm.northlake.internal
  when: manual
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
