# Minimal local checks; the final job is a review reminder, not deployment.
stages: [lint, test, review]
default:
  image: python:3.12-slim
  before_script:
    - pip install --quiet uv==0.11.7
    - uv sync --locked
lint:
  stage: lint
  script: [uv run --no-sync ruff check --select E9,F63,F7,F82 src tests]
unit_tests:
  stage: test
  script: [uv run --no-sync pytest tests/test_ncr.py --junitxml=reports/unit.xml]
  artifacts:
    when: always
    reports: {junit: reports/unit.xml}
review_release:
  stage: review
  script:
    - echo 'Review the test report before adopting the full release workflow.'
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      when: manual
      allow_failure: false
