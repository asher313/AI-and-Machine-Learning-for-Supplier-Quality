# Seven-stage, synthetic release rehearsal. No production service is deployed.
stages: [lint, test, data, train, evaluate, register, deploy]
workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS && $CI_PIPELINE_SOURCE == "push"'
      when: never
    - if: '$CI_COMMIT_BRANCH'
variables:
  UV_CACHE_DIR: .cache/uv
  PYTHONPATH: src
  HF_HUB_OFFLINE: '1'
  AWS_EC2_METADATA_DISABLED: 'true'
default:
  image: python:3.12-slim
  tags: [standard]
  cache:
    key:
      files: [uv.lock]
      prefix: python312-linux
    paths: [.cache/uv]
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends libgomp1
    - pip install --quiet uv==0.11.7
    - uv sync --locked --extra ml

lint:
  stage: lint
  script:
    - uv run --no-sync python -m compileall -q src
    - uv run --no-sync ruff check --select E9,F63,F7,F82 src tests

unit_tests:
  stage: test
  script:
    - >-
      uv run --no-sync pytest tests/test_ncr.py tests/test_review_foundations.py
      tests/test_ci.py tests/gateway tests/build1/test_training_partitions.py
      --junitxml=reports/unit.xml
  artifacts:
    when: always
    reports: {junit: reports/unit.xml}
    expire_in: 30 days

validate_data:
  stage: data
  script:
    - uv run --no-sync python scripts/generate_data.py --output data --skip-cnc
    - uv run --no-sync python -m sqm_ai.verify_synthetic --data data
  artifacts:
    paths: [data/supplier_month.parquet, data/synthetic_manifest.json]
    expire_in: 7 days

train_model:
  stage: train
  needs: [validate_data]
  timeout: 2 hours
  script:
    - >-
      uv run --no-sync python -m sqm_ai.build1.train
      --input data/supplier_month.parquet --output artifacts/model
      --trees 30
  artifacts:
    paths: [artifacts/model/]
    expire_in: 7 days

evaluate:
  stage: evaluate
  needs: [train_model]
  script:
    - >-
      uv run --no-sync python -m sqm_ai.ci.gate
      --metrics artifacts/model/metrics.json
      --min-auc 0.85 --min-recall-sev3 0.90
      --report reports/evaluation.json
  artifacts:
    when: always
    paths: [reports/evaluation.json]
    expire_in: 30 days

register_model:
  stage: register
  needs: [train_model, evaluate]
  script:
    - >-
      uv run --no-sync python -m sqm_ai.ci.pipeline register
      --model artifacts/model --gate reports/evaluation.json
      --code-sha "$CI_COMMIT_SHA" --run-id "$CI_PIPELINE_ID"
      --out artifacts/registry/release.json
  artifacts:
    paths: [artifacts/model/, artifacts/registry/]
    expire_in: 7 days

deploy_staging:
  stage: deploy
  needs: [register_model]
  script:
    - >-
      uv run --no-sync python -m sqm_ai.ci.pipeline deploy
      --release artifacts/registry/release.json --model artifacts/model
      --target staging --out reports/staging-rehearsal.json
  artifacts:
    paths: [reports/staging-rehearsal.json]
    expire_in: 30 days
  environment: {name: rehearsal/staging}

deploy_production:
  stage: deploy
  needs: [register_model, deploy_staging]
  script:
    - >-
      uv run --no-sync python -m sqm_ai.ci.pipeline deploy
      --release artifacts/registry/release.json --model artifacts/model
      --target production --out reports/production-rehearsal.json
  artifacts:
    paths: [reports/production-rehearsal.json]
    expire_in: 30 days
  environment: {name: rehearsal/production}
  resource_group: production-rehearsal
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      when: manual
      allow_failure: false
